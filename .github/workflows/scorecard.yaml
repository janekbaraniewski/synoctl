name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "47 5 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Only publish to api.scorecard.dev on the scheduled cron run.
          # That endpoint has been intermittently failing with context
          # deadline exceeded, which turns every push-to-main into a red
          # check even though analysis + SARIF upload both succeed. The
          # public badge only needs one fresh publish per week.
          publish_results: ${{ github.event_name == 'schedule' }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Prepare code scanning SARIF
        run: jq -f .github/scorecard-code-scanning-filter.jq results.sarif > code-scanning-results.sarif

      - name: Upload to GitHub code scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: code-scanning-results.sarif
